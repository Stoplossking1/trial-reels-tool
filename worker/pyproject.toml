[project]
name = "trialreels"
version = "0.1.0"
description = "Turn one vertical video into Instagram trial-reel versions"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pillow>=10",
  "opencv-python-headless>=4.9",
  "mediapipe>=0.10.14",
  "anthropic>=1.0",
  "pydantic>=2",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
trialreels = "trialreels.cli:main"

[tool.setuptools.packages.find]
include = ["trialreels*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
